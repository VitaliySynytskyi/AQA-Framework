[behave]
# Behave Configuration

# Output formats
show_skipped = false
show_timings = true
color = true
format = progress

# Paths
paths = features

# Stop on first failure
stop = false

# Logging
logging_level = INFO
logging_clear_handlers = true
logging_filter = -selenium

# Reports
junit = true
junit_directory = reports/junit

# Default language
lang = en

# Default tags to run (can be overridden via command line)
# tags = ~@wip

# Summary
summary = true

# Snippets
snippets = true
