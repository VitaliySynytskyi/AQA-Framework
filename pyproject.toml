[tool.black]
line-length = 127
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | env
  | _build
  | buck-out
  | build
  | dist
  | htmlcov
  | \.pytest_cache
  | allure-results
  | allure-report
  | screenshots
  | logs
  | reports
)/
'''

[tool.bandit]
exclude_dirs = [
    "venv",
    "env",
    ".venv",
    ".eggs",
    "htmlcov",
    ".pytest_cache",
    "allure-results",
    "allure-report",
    "screenshots",
    "logs",
    "reports"
]
# Skip B101 (assert_used) - asserts are required in unit tests
skips = ["B101"]
